<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-white m-0 p-0 font-sans antialiased min-h-screen flex flex-col">
  <div class="flex-1 flex flex-col justify-center px-8">
    <div class="flex flex-col items-center mb-12">
      <div class="w-20 h-20 bg-teal-600 rounded-2xl flex items-center justify-center mb-4">
        <i data-lucide="wrench" class="w-10 h-10 text-white"></i>
      </div>
      <h1 class="text-4xl font-bold text-gray-900">Fixly</h1>
      <p class="text-gray-600 mt-2">Welcome back!</p>
    </div>

    <!-- Phone View -->
    <div id="login-phone-view" class="space-y-6">
      <div class="mui-textfield">
        <label>Phone Number</label>
        <input type="tel" id="login-phone-input" placeholder="Enter your phone number">
      </div>

      <button id="login-send-otp-btn" disabled class="w-full bg-[#0d9488] hover:bg-[#0f766e] disabled:bg-[#d1d5db] disabled:text-[#9ca3af] text-white rounded-xl p-[14px] text-[16px] font-semibold transition-colors shadow-md">
        Send OTP
      </button>

      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px bg-gray-300"></div>
        <span class="text-gray-500 text-sm">or continue with</span>
        <div class="flex-1 h-px bg-gray-300"></div>
      </div>

      <button onclick="window.location.href='home.html'" class="w-full border border-[#e5e7eb] hover:border-[#d1d5db] hover:bg-[#f9fafb] text-[#374151] rounded-xl p-[14px] text-[16px] font-semibold transition-colors flex justify-center items-center">
        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <!-- OTP View -->
    <div id="login-otp-view" class="space-y-6 hidden">
      <div>
        <p class="text-gray-600 text-sm mb-4" id="login-otp-text">
          Enter the 6-digit code sent to
        </p>
        <div class="mui-textfield">
          <label>OTP Code</label>
          <input type="text" id="login-otp-input" placeholder="Enter 6-digit code" maxlength="6">
        </div>
      </div>

      <button id="login-verify-btn" disabled class="w-full bg-[#0d9488] hover:bg-[#0f766e] disabled:bg-[#d1d5db] disabled:text-[#9ca3af] text-white rounded-xl p-[14px] text-[16px] font-semibold transition-colors shadow-md">
        Verify & Continue
      </button>

      <button id="login-change-phone-btn" class="w-full text-[#6b7280] p-[14px] hover:bg-gray-50 rounded-xl transition-colors">
        Change Phone Number
      </button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const phoneInput = document.getElementById('login-phone-input');
    const otpInput = document.getElementById('login-otp-input');
    const sendOtpBtn = document.getElementById('login-send-otp-btn');
    const verifyBtn = document.getElementById('login-verify-btn');
    const changePhoneBtn = document.getElementById('login-change-phone-btn');
    const phoneView = document.getElementById('login-phone-view');
    const otpView = document.getElementById('login-otp-view');

    let phone = '';
    let otp = '';

    phoneInput.oninput = (e) => {
      phone = e.target.value;
      sendOtpBtn.disabled = phone.length < 10;
    };

    otpInput.oninput = (e) => {
      e.target.value = e.target.value.replace(/\\D/g, '').slice(0, 6);
      otp = e.target.value;
      verifyBtn.disabled = otp.length !== 6;
    };

    sendOtpBtn.onclick = () => {
      if (phone.length >= 10) {
        phoneView.classList.add('hidden');
        otpView.classList.remove('hidden');
        document.getElementById('login-otp-text').innerText = `Enter the 6-digit code sent to ${phone}`;
      }
    };

    changePhoneBtn.onclick = () => {
      otp = '';
      otpInput.value = '';
      verifyBtn.disabled = true;
      phoneView.classList.remove('hidden');
      otpView.classList.add('hidden');
    };

    verifyBtn.onclick = () => {
      if (otp.length === 6) window.location.href = 'home.html';
    };
  </script>
</body>
</html>
