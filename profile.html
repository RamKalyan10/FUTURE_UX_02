<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly - Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-gray-50 m-0 p-0 font-sans antialiased min-h-screen pb-20 relative">
  <div class="bg-gradient-to-br from-teal-500 to-blue-600 rounded-b-3xl px-6 pt-12 pb-20">
    <button onclick="window.history.back()" class="p-2 -ml-2 mb-6 hover:bg-white/10 rounded-full transition">
      <i data-lucide="arrow-left" class="w-6 h-6 text-white"></i>
    </button>

    <div class="flex items-center gap-4">
      <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-4xl shadow-md">
        👤
      </div>
      <div class="flex-1 text-white">
        <h1 class="text-2xl font-bold mb-1">John Doe</h1>
        <p class="text-white/90">john.doe@email.com</p>
        <p class="text-white/80 text-sm mt-1">+1 (555) 123-4567</p>
      </div>
    </div>
  </div>

  <div class="px-6 -mt-12 mb-6">
    <div class="bg-white rounded-2xl p-5 shadow-lg">
      <div class="grid grid-cols-3 gap-4 text-center">
        <div>
          <p class="text-2xl font-bold text-teal-600">12</p>
          <p class="text-sm text-gray-600 mt-1">Bookings</p>
        </div>
        <div class="border-l border-r border-gray-200">
          <p class="text-2xl font-bold text-teal-600">8</p>
          <p class="text-sm text-gray-600 mt-1">Completed</p>
        </div>
        <div>
          <p class="text-2xl font-bold text-teal-600">₹8,500</p>
          <p class="text-sm text-gray-600 mt-1">Total Spent</p>
        </div>
      </div>
    </div>
  </div>

  <div class="px-6 mb-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-gray-900">Recent Bookings</h2>
      <button class="text-teal-600 text-sm font-medium hover:underline">View All</button>
    </div>
    <div class="space-y-3" id="profile-recent-bookings">
      <!-- Injected via JS -->
    </div>
  </div>

  <div class="px-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Account</h2>
    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100" id="profile-menu">
      <!-- Injected via JS -->
    </div>
  </div>

  <div class="px-6 mb-24">
    <button onclick="window.location.href='login.html'" class="w-full bg-white border border-red-200 rounded-2xl p-4 flex items-center justify-center gap-3 hover:bg-red-50 transition">
      <i data-lucide="log-out" class="w-5 h-5 text-red-600"></i>
      <span class="text-red-600 font-semibold">Logout</span>
    </button>
  </div>

  <!-- Bottom Nav -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 z-50">
    <div class="flex items-center justify-around max-w-md mx-auto">
      <button onclick="window.location.href='home.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 transition">
        <div class="w-6 h-6 flex items-center justify-center">
          <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
        </div>
        <span class="text-xs">Home</span>
      </button>
      <button onclick="window.location.href='bookings.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 transition">
        <i data-lucide="star" class="w-6 h-6"></i>
        <span class="text-xs">Bookings</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-teal-600">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-xs font-medium">Profile</span>
      </button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let allBookings = getAppBookings().slice(0, 3);
      
      const rbHtml = allBookings.map(b => `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer">
          <div class="flex items-start justify-between mb-3">
            <div>
              <h3 class="font-semibold text-gray-900 mb-1">${b.service}</h3>
              <p class="text-sm text-gray-600">${b.specialist}</p>
            </div>
            <span class="px-3 py-1 rounded-lg text-xs font-medium ${b.statusColor}">
              ${b.status}
            </span>
          </div>
          <div class="flex items-center gap-4 text-sm text-gray-500">
            <div class="flex items-center gap-1">
              <i data-lucide="calendar" class="w-4 h-4"></i>
              <span>${b.date}</span>
            </div>
            <div class="flex items-center gap-1">
              <i data-lucide="clock" class="w-4 h-4"></i>
              <span>${b.time}</span>
            </div>
          </div>
        </div>
      `).join('');
      document.getElementById('profile-recent-bookings').innerHTML = rbHtml;

      const menuHtml = DATA.profileMenu.map((m, i) => `
        <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition border-b border-gray-100 last:border-0">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center">
              <i data-lucide="${m.icon}" class="w-5 h-5 text-gray-600"></i>
            </div>
            <span class="text-gray-900 font-medium">${m.label}</span>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
        </button>
      `).join('');
      document.getElementById('profile-menu').innerHTML = menuHtml;

      lucide.createIcons();
    });
  </script>
</body>
</html>
