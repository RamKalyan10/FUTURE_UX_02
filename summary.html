<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly - Booking Summary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-gray-50 m-0 p-0 font-sans antialiased min-h-screen pb-32 relative">
  <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center gap-4 z-10">
    <button onclick="window.history.back()" class="p-2 -ml-2 hover:bg-gray-100 rounded-full transition">
      <i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i>
    </button>
    <h1 class="text-lg font-semibold text-gray-900">Booking Summary</h1>
  </div>

  <div class="px-6 py-6" id="summary-content">
    <!-- Injected via JS -->
  </div>

  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-4 z-50">
    <div class="flex items-center justify-between mb-3">
      <span class="text-gray-600">Total Amount</span>
      <span class="text-2xl font-bold text-teal-600" id="summary-total-footer"></span>
    </div>
    <button id="summary-confirm-btn" class="w-full bg-[#0d9488] hover:bg-[#0f766e] text-white rounded-xl p-[14px] text-[16px] font-semibold transition-colors shadow-md">
      Confirm Booking
    </button>
  </div>

  <script src="shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const specialistId = parseInt(localStorage.getItem('selectedSpecialistId')) || 1;
      const serviceId = getQueryParam('serviceId') || 'cleaning';
      const bookingDate = localStorage.getItem('bookingDate') || 'Mon, May 11';
      const bookingTime = localStorage.getItem('bookingTime') || '10:00 AM';
      const bookingAddress = localStorage.getItem('bookingAddress') || 'Flat 402, Srinivasa Heights, Vijayawada, Andhra Pradesh, India';

      const sp = DATA.specialists.find(s => s.id === specialistId) || DATA.specialists[0];
      const serviceFee = DATA.serviceDetails[serviceId] ? DATA.serviceDetails[serviceId].price : 180;
      const discount = 36;
      const total = serviceFee - discount;

      document.getElementById('summary-total-footer').innerText = `₹${total}.00`;

      document.getElementById('summary-content').innerHTML = `
        <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-gray-100">
          <div class="flex items-center gap-2 mb-4">
            <i data-lucide="user" class="w-5 h-5 text-teal-600"></i>
            <h2 class="text-lg font-semibold text-gray-900">Service Provider</h2>
          </div>
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-gradient-to-br from-teal-100 to-blue-100 rounded-2xl flex items-center justify-center text-3xl">
              ${sp.avatar}
            </div>
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-1">
                <h3 class="font-semibold text-gray-900">${sp.name}</h3>
                <i data-lucide="badge-check" class="w-5 h-5 text-blue-500 fill-blue-100"></i>
              </div>
              <p class="text-sm text-gray-600">${sp.specialty} • ${sp.experience} exp.</p>
              <p class="text-sm text-yellow-600 mt-1">⭐ ${sp.rating} (${sp.reviews} reviews)</p>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-gray-100">
          <div class="flex items-center gap-2 mb-4">
            <i data-lucide="calendar" class="w-5 h-5 text-teal-600"></i>
            <h2 class="text-lg font-semibold text-gray-900">Appointment Details</h2>
          </div>
          <div class="space-y-4">
            <div class="flex items-start gap-3">
              <div class="w-10 h-10 bg-teal-50 rounded-xl flex items-center justify-center flex-shrink-0">
                <i data-lucide="calendar" class="w-5 h-5 text-teal-600"></i>
              </div>
              <div>
                <p class="text-sm text-gray-500 mb-1">Date</p>
                <p class="font-medium text-gray-900">${bookingDate}</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center flex-shrink-0">
                <i data-lucide="clock" class="w-5 h-5 text-blue-600"></i>
              </div>
              <div>
                <p class="text-sm text-gray-500 mb-1">Time</p>
                <p class="font-medium text-gray-900">${bookingTime}</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center flex-shrink-0">
                <i data-lucide="map-pin" class="w-5 h-5 text-purple-600"></i>
              </div>
              <div>
                <p class="text-sm text-gray-500 mb-1">Service Address</p>
                <p class="font-medium text-gray-900">${bookingAddress}</p>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-gray-100">
          <div class="flex items-center gap-2 mb-4">
            <i data-lucide="tag" class="w-5 h-5 text-teal-600"></i>
            <h2 class="text-lg font-semibold text-gray-900">Payment Details</h2>
          </div>
          <div class="space-y-3">
            <div class="flex justify-between">
              <span class="text-gray-600">Service Fee</span>
              <span class="font-medium text-gray-900">₹${serviceFee}.00</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-gray-600">First Booking Discount</span>
              <span class="font-medium text-green-600">-₹${discount}.00</span>
            </div>
            <hr class="border-gray-200">
            <div class="flex justify-between items-center">
              <span class="text-lg font-semibold text-gray-900">Total</span>
              <span class="text-2xl font-bold text-teal-600">₹${total}.00</span>
            </div>
          </div>
        </div>

        <div class="bg-gradient-to-r from-green-50 to-teal-50 border border-green-200 rounded-2xl p-4">
          <div class="flex gap-3">
            <div class="text-2xl">🎉</div>
            <div>
              <p class="font-semibold text-green-900 mb-1">20% First Booking Discount Applied!</p>
              <p class="text-sm text-green-700">You saved ₹100 on this booking</p>
            </div>
          </div>
        </div>
      `;

      document.getElementById('summary-confirm-btn').onclick = () => {
        window.location.href = `confirmation.html?serviceId=${serviceId}`;
      };

      lucide.createIcons();
    });
  </script>
</body>
</html>
