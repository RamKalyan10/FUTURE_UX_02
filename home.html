<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-gray-50 m-0 p-0 font-sans antialiased min-h-screen pb-20">
  <div class="bg-gradient-to-br from-teal-500 to-blue-600 rounded-b-3xl px-6 pt-12 pb-8">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2">
        <i data-lucide="map-pin" class="w-5 h-5 text-white"></i>
        <div>
          <p class="text-white/80 text-xs">Location</p>
          <p class="text-white font-medium">Vijayawada, AP, India</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="window.location.href='notifications.html'" class="p-2 text-white hover:bg-white/10 rounded-full transition">
          <i data-lucide="bell" class="w-6 h-6"></i>
        </button>
        <button onclick="window.location.href='profile.html'" class="p-2 text-white hover:bg-white/10 rounded-full transition">
          <i data-lucide="user" class="w-6 h-6"></i>
        </button>
      </div>
    </div>

    <div class="relative w-full">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i data-lucide="search" class="text-gray-400 w-5 h-5"></i>
      </div>
      <input type="text" class="w-full bg-white rounded-2xl pl-10 pr-4 py-3 outline-none text-gray-900 shadow-sm" placeholder="Search for services...">
    </div>
  </div>

  <div class="px-6 mt-6">
    <div class="bg-gradient-to-r from-red-500 to-orange-500 rounded-2xl p-5 mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-white font-bold text-lg mb-1">Emergency Service?</h3>
          <p class="text-white/90 text-sm">24/7 urgent help available</p>
        </div>
        <button onclick="window.location.href='service.html?id=emergency'" class="bg-white text-red-600 px-5 py-2.5 rounded-xl font-semibold text-sm hover:bg-gray-50 transition">
          Book Now
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold text-gray-900">Categories</h2>
    </div>

    <div class="grid grid-cols-3 gap-4 mb-8" id="home-categories">
      <!-- Injected via JS -->
    </div>

    <div class="bg-teal-50 border border-teal-200 rounded-2xl p-4 mb-6">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-teal-900 font-semibold">First Booking Offer</p>
          <p class="text-teal-700 text-sm">Get 20% OFF on your first service</p>
        </div>
        <div class="bg-teal-600 text-white px-4 py-2 rounded-xl font-bold">
          20% OFF
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold text-gray-900">Popular Services</h2>
      <button class="text-teal-600 text-sm font-medium">See all</button>
    </div>

    <div class="space-y-4" id="home-popular-services">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 z-50">
    <div class="flex items-center justify-around max-w-md mx-auto">
      <button class="flex flex-col items-center gap-1 text-teal-600">
        <div class="w-6 h-6 flex items-center justify-center">
          <div class="w-2 h-2 bg-teal-600 rounded-full"></div>
        </div>
        <span class="text-xs font-medium">Home</span>
      </button>
      <button onclick="window.location.href='bookings.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 transition">
        <i data-lucide="star" class="w-6 h-6"></i>
        <span class="text-xs">Bookings</span>
      </button>
      <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 transition">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-xs">Profile</span>
      </button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const catHtml = DATA.categories.map(c => `
        <button onclick="window.location.href='service.html?id=${c.id}'" class="flex flex-col items-center gap-3 bg-white p-4 rounded-2xl hover:shadow-md transition shadow-sm border border-gray-100">
          <div class="w-14 h-14 rounded-2xl ${c.color} flex items-center justify-center">
            <i data-lucide="${c.icon}" class="w-7 h-7"></i>
          </div>
          <span class="text-sm font-medium text-gray-700 text-center">${c.name}</span>
        </button>
      `).join('');
      document.getElementById('home-categories').innerHTML = catHtml;

      const popHtml = DATA.popularServices.map(s => `
        <div onclick="window.location.href='service.html?id=${s.id}'" class="bg-white rounded-2xl p-4 shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-gray-100 cursor-pointer hover:shadow-[0_4px_12px_rgba(0,0,0,0.1)] transition">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <h3 class="font-semibold text-gray-900 mb-1">${s.name}</h3>
              <p class="text-sm text-gray-500 mb-2">${s.category}</p>
              <div class="flex items-center gap-3 text-sm">
                <div class="flex items-center gap-1">
                  <i data-lucide="star" class="w-4 h-4 text-yellow-500 fill-yellow-500"></i>
                  <span class="font-medium">${s.rating}</span>
                  <span class="text-gray-400">(${s.reviews})</span>
                </div>
                <span class="text-gray-400">•</span>
                <span class="text-gray-600">${s.duration}</span>
              </div>
            </div>
            <div class="flex flex-col items-end gap-2">
              <p class="text-2xl font-bold text-teal-600">₹${s.price}</p>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
            </div>
          </div>
        </div>
      `).join('');
      document.getElementById('home-popular-services').innerHTML = popHtml;
      lucide.createIcons();
    });
  </script>
</body>
</html>
