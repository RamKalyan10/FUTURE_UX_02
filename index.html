<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly - Service Booking App</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 m-0 p-0 font-sans antialiased">
  <div class="min-h-screen w-full flex flex-col items-center justify-center bg-gradient-to-br from-teal-500 to-blue-600">
    <div class="animate-bounce">
      <div class="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-2xl">
        <i data-lucide="wrench" class="w-12 h-12 text-teal-600"></i>
      </div>
    </div>
    <h1 class="mt-8 text-5xl font-bold text-white">Fixly</h1>
    <p class="mt-3 text-xl text-white/90">Trusted Home Services at Your Doorstep</p>
  </div>

  <script src="shared.js"></script>
  <script>
    setTimeout(() => {
      window.location.href = 'onboarding.html';
    }, 2500);
  </script>
</body>
</html>
