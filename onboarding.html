<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly - Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-white m-0 p-0 font-sans antialiased min-h-screen flex flex-col">
  <div class="flex justify-end p-4">
    <button onclick="window.location.href='login.html'" class="uppercase text-[#6b7280] font-medium tracking-wide px-2 py-1 rounded hover:bg-gray-100 transition">
      Skip
    </button>
  </div>

  <div class="flex-1 flex flex-col items-center justify-center px-8 pb-20" id="onboarding-content">
    <!-- Injected via JS -->
  </div>

  <div class="pb-12 px-8">
    <div class="flex justify-center gap-2 mb-8" id="onboarding-dots">
      <!-- Injected via JS -->
    </div>

    <button id="onboarding-next-btn" class="w-full bg-[#0d9488] hover:bg-[#0f766e] text-white rounded-xl p-[14px] text-[16px] font-semibold transition-colors shadow-md">
      Next
    </button>
  </div>

  <script src="shared.js"></script>
  <script>
    let currentSlide = 0;

    function renderOnboarding() {
      const slide = DATA.onboarding[currentSlide];
      document.getElementById('onboarding-content').innerHTML = `
        <div class="mb-12 ${slide.color}">
          <i data-lucide="${slide.icon}" class="w-32 h-32" stroke-width="1.5"></i>
        </div>
        <h2 class="text-3xl font-bold text-center text-gray-900 mb-4">${slide.title}</h2>
        <p class="text-center text-gray-600 text-lg max-w-md">${slide.desc}</p>
      `;

      let dots = '';
      for (let i = 0; i < DATA.onboarding.length; i++) {
        dots += `<div class="h-2 rounded-full transition-all ${i === currentSlide ? 'w-8 bg-teal-600' : 'w-2 bg-gray-300'}"></div>`;
      }
      document.getElementById('onboarding-dots').innerHTML = dots;

      const btn = document.getElementById('onboarding-next-btn');
      btn.innerText = currentSlide === DATA.onboarding.length - 1 ? 'Get Started' : 'Next';
      lucide.createIcons();
    }

    document.getElementById('onboarding-next-btn').onclick = () => {
      if (currentSlide < DATA.onboarding.length - 1) {
        currentSlide++;
        renderOnboarding();
      } else {
        window.location.href = 'login.html';
      }
    };

    document.addEventListener('DOMContentLoaded', renderOnboarding);
  </script>
</body>
</html>
