<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly - Confirmation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-gray-50 m-0 p-0 font-sans antialiased min-h-screen flex flex-col">
  <div class="flex-1 flex flex-col items-center justify-center px-6 py-12" id="confirmation-content">
    <!-- Injected via JS -->
  </div>

  <div class="px-6 pb-6">
    <div class="flex gap-3 max-w-md mx-auto">
      <button onclick="window.location.href='home.html'" class="w-full border border-[#0d9488] text-[#0d9488] hover:bg-[#f0fdfa] rounded-xl p-[14px] text-[16px] font-semibold transition-colors">
        Back to Home
      </button>
      <button onclick="window.location.href='profile.html'" class="w-full bg-[#0d9488] hover:bg-[#0f766e] text-white rounded-xl p-[14px] text-[16px] font-semibold transition-colors shadow-md">
        View Bookings
      </button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const specialistId = parseInt(localStorage.getItem('selectedSpecialistId')) || 1;
      const bookingDate = localStorage.getItem('bookingDate') || 'Mon, May 11';
      const bookingTime = localStorage.getItem('bookingTime') || '10:00 AM';
      const bookingAddress = localStorage.getItem('bookingAddress') || 'Flat 402, Srinivasa Heights, Vijayawada, Andhra Pradesh, India';
      
      const sp = DATA.specialists.find(s => s.id === specialistId) || DATA.specialists[0];
      const bookingId = `FX${Date.now().toString().slice(-8)}`;

      document.getElementById('confirmation-content').innerHTML = `
        <div class="w-24 h-24 bg-gradient-to-br from-green-400 to-teal-500 rounded-full flex items-center justify-center mb-6 animate-bounce shadow-lg">
          <i data-lucide="check-circle" class="w-14 h-14 text-white" stroke-width="2.5"></i>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-3 text-center">Booking Confirmed!</h1>
        <p class="text-gray-600 text-center mb-8 max-w-sm">
          Your service has been successfully booked. The specialist will arrive at your location on time.
        </p>

        <div class="w-full max-w-md bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6">
          <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
            <span class="text-gray-600">Booking ID</span>
            <span class="font-bold text-teal-600 text-lg">${bookingId}</span>
          </div>
          <div class="space-y-4">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-teal-50 rounded-xl flex items-center justify-center flex-shrink-0">
                <i data-lucide="calendar" class="w-6 h-6 text-teal-600"></i>
              </div>
              <div>
                <p class="text-sm text-gray-500">Date</p>
                <p class="font-semibold text-gray-900">${bookingDate}</p>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center flex-shrink-0">
                <i data-lucide="clock" class="w-6 h-6 text-blue-600"></i>
              </div>
              <div>
                <p class="text-sm text-gray-500">Time</p>
                <p class="font-semibold text-gray-900">${bookingTime}</p>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-purple-50 rounded-xl flex items-center justify-center flex-shrink-0">
                <i data-lucide="map-pin" class="w-6 h-6 text-purple-600"></i>
              </div>
              <div class="flex-1">
                <p class="text-sm text-gray-500">Location</p>
                <p class="font-semibold text-gray-900 text-sm">${bookingAddress}</p>
              </div>
            </div>
          </div>
        </div>

        <div class="w-full max-w-md bg-gradient-to-br from-teal-500 to-blue-600 rounded-2xl p-6 text-white mb-6 shadow-md">
          <div class="flex items-center gap-4 mb-4">
            <div class="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center text-3xl">
              ${sp.avatar}
            </div>
            <div class="flex-1">
              <h3 class="font-semibold text-lg mb-1">${sp.name}</h3>
              <p class="text-white/90 text-sm">Your assigned specialist</p>
            </div>
          </div>
          <div class="flex gap-3">
            <button class="flex-1 bg-white/20 backdrop-blur-sm hover:bg-white/30 transition rounded-xl py-3 flex items-center justify-center gap-2">
              <i data-lucide="phone" class="w-5 h-5"></i>
              <span class="font-medium">Call</span>
            </button>
            <button class="flex-1 bg-white/20 backdrop-blur-sm hover:bg-white/30 transition rounded-xl py-3 flex items-center justify-center gap-2">
              <i data-lucide="message-circle" class="w-5 h-5"></i>
              <span class="font-medium">Message</span>
            </button>
          </div>
        </div>

        <div class="w-full max-w-md bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-6">
          <p class="text-blue-900 text-sm text-center">
            📱 <span class="font-semibold">Track your booking:</span> You'll receive live updates and can track your specialist's location when they're on the way
          </p>
        </div>
      `;

      const serviceId = getQueryParam('serviceId') || 'cleaning';
      const serviceName = DATA.serviceDetails[serviceId] ? DATA.serviceDetails[serviceId].name : 'Deep House Cleaning';
      
      const newBooking = {
        id: bookingId,
        service: serviceName,
        specialist: sp.name,
        date: bookingDate,
        time: bookingTime,
        status: 'Upcoming',
        statusColor: 'text-blue-600 bg-blue-50'
      };

      let existingBookings = getAppBookings();
      // Avoid duplicate saving if user reloads confirmation page
      if (!existingBookings.find(b => b.id === bookingId)) {
        existingBookings.unshift(newBooking);
        saveAppBookings(existingBookings);
      }

      lucide.createIcons();

      // Trigger Confetti
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#0d9488', '#14b8a6', '#2dd4bf', '#34d399', '#6ee7b7']
      });
    });
  </script>
</body>
</html>
