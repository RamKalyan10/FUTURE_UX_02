<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly - Bookings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-gray-50 m-0 p-0 font-sans antialiased min-h-screen pb-24 relative">
  <div class="sticky top-0 bg-white border-b border-gray-200 z-10">
    <div class="px-6 py-4 flex items-center gap-4">
      <h1 class="text-xl font-bold text-gray-900">My Bookings</h1>
    </div>
    <div class="flex border-t border-gray-100">
      <button id="tab-upcoming" onclick="switchTab('upcoming')" class="flex-1 py-3 text-sm font-semibold border-b-2 border-teal-600 text-teal-600 transition">
        Upcoming
      </button>
      <button id="tab-past" onclick="switchTab('past')" class="flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition">
        Past
      </button>
    </div>
  </div>

  <div class="px-6 py-6" id="bookings-list">
    <!-- Injected via JS -->
  </div>

  <!-- Bottom Nav -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 z-50">
    <div class="flex items-center justify-around max-w-md mx-auto">
      <button onclick="window.location.href='home.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 transition">
        <div class="w-6 h-6 flex items-center justify-center">
          <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
        </div>
        <span class="text-xs">Home</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-teal-600">
        <i data-lucide="star" class="w-6 h-6 text-teal-600"></i>
        <span class="text-xs font-medium">Bookings</span>
      </button>
      <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 transition">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-xs">Profile</span>
      </button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    let currentTab = 'upcoming';
    let localBookings = getAppBookings();

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-upcoming').className = tab === 'upcoming' 
        ? "flex-1 py-3 text-sm font-semibold border-b-2 border-teal-600 text-teal-600 transition"
        : "flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition";
      
      document.getElementById('tab-past').className = tab === 'past' 
        ? "flex-1 py-3 text-sm font-semibold border-b-2 border-teal-600 text-teal-600 transition"
        : "flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition";
        
      renderBookings();
    }

    function cancelBooking(id) {
      if(confirm('Are you sure you want to cancel this booking?')) {
        localBookings = localBookings.map(b => b.id === id ? { ...b, status: 'Cancelled', statusColor: 'text-red-600 bg-red-50' } : b);
        saveAppBookings(localBookings);
        renderBookings();
      }
    }

    function renderBookings() {
      const filtered = localBookings.filter(b => 
        currentTab === 'upcoming' ? b.status === 'Upcoming' : b.status !== 'Upcoming'
      );

      if (filtered.length === 0) {
        document.getElementById('bookings-list').innerHTML = `
          <div class="flex flex-col items-center justify-center mt-20 text-gray-400">
            <i data-lucide="calendar-x" class="w-16 h-16 mb-4"></i>
            <p>No ${currentTab} bookings found</p>
          </div>
        `;
      } else {
        const html = filtered.map(b => `
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
            <div class="flex items-start justify-between mb-4 border-b border-gray-100 pb-4">
              <div>
                <span class="text-xs text-gray-500 block mb-1">Booking ID: ${b.id}</span>
                <h3 class="font-bold text-gray-900">${b.service}</h3>
                <p class="text-sm text-gray-600 mt-1">Specialist: ${b.specialist}</p>
              </div>
              <span class="px-3 py-1 rounded-lg text-xs font-semibold ${b.statusColor}">
                ${b.status}
              </span>
            </div>
            
            <div class="flex items-center gap-6 mb-4 text-sm text-gray-600">
              <div class="flex items-center gap-2">
                <i data-lucide="calendar" class="w-4 h-4 text-teal-600"></i>
                <span class="font-medium">${b.date}</span>
              </div>
              <div class="flex items-center gap-2">
                <i data-lucide="clock" class="w-4 h-4 text-teal-600"></i>
                <span class="font-medium">${b.time}</span>
              </div>
            </div>

            ${b.status === 'Upcoming' ? `
              <div class="flex gap-3 pt-2">
                <button class="flex-1 border border-teal-600 text-teal-600 rounded-xl py-2.5 text-sm font-semibold hover:bg-teal-50 transition">
                  Reschedule
                </button>
                <button onclick="cancelBooking('${b.id}')" class="flex-1 border border-red-200 text-red-600 rounded-xl py-2.5 text-sm font-semibold hover:bg-red-50 transition">
                  Cancel
                </button>
              </div>
            ` : `
              <button class="w-full bg-[#0d9488] text-white rounded-xl py-2.5 text-sm font-semibold hover:bg-[#0f766e] transition">
                Book Again
              </button>
            `}
          </div>
        `).join('');
        document.getElementById('bookings-list').innerHTML = html;
      }
      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBookings();
    });
  </script>
</body>
</html>
